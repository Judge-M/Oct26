worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/silent-ridge/participant.pem;
    ssl_certificate_key /etc/silent-ridge/participant-key.pem;
    client_max_body_size 128m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    # Docker may publish this listener on a different host port. The Host and
    # X-Forwarded-Host headers already carry that public port; sending the
    # container listener port here corrupts application login redirects.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Certificate revocation must remain available before any TLS handshake.
    # Serve the signed CRL over plain HTTP so checking it does not depend on the
    # certificate whose status the client is trying to establish.
    server {
        listen 8080;
        location = /root-ca.crl {
            alias /etc/silent-ridge/root-ca.crl;
            default_type application/pkix-crl;
            add_header Cache-Control "no-store" always;
        }
        location / { return 404; }
    }

    server {
        listen 8081 ssl;
        location / {
            set $upstream http://iris:8000;
            proxy_pass $upstream;
        }
    }
    server {
        listen 8082 ssl;
        location / {
            set $upstream http://guacamole:8080;
            proxy_pass $upstream;
        }
    }
    server {
        listen 8083 ssl;
        location / {
            set $upstream http://ctfd:8000;
            proxy_pass $upstream;
        }
    }
}

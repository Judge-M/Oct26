name: ${RIDGE_PROJECT:-silent-ridge}-wazuh
services:
  wazuh-indexer:
    image: ${WAZUH_INDEXER_IMAGE:?Set pinned immutable Wazuh indexer image}
    pull_policy: never
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ${WAZUH_CERTS_DIR}/indexer.pem:/usr/share/wazuh-indexer/certs/indexer.pem:ro
      - ${WAZUH_CERTS_DIR}/indexer-key.pem:/usr/share/wazuh-indexer/certs/indexer-key.pem:ro
      - ${WAZUH_CERTS_DIR}/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ${WAZUH_CERTS_DIR}/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
      - ${WAZUH_CONFIG_DIR:?Set vendored Wazuh config directory}/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ${WAZUH_CONFIG_DIR}/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    ports:
      # Loopback-only: controller provisioning/queries; participants use the dashboard.
      - ${BIND_IP:-127.0.0.1}:${WAZUH_INDEXER_PORT:-9200}:9200
    networks: [wazuh-backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "curl --cacert /usr/share/wazuh-indexer/certs/root-ca.pem -s https://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
  wazuh-manager:
    image: ${WAZUH_MANAGER_IMAGE:?Set pinned immutable Wazuh manager image}
    pull_policy: never
    restart: unless-stopped
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}/root-ca.pem:/etc/ssl/certs/silent-ridge-root-ca.pem:ro
      - ${WAZUH_CONFIG_DIR:?Set vendored Wazuh config directory}/wazuh_cluster/wazuh_manager.conf:/var/ossec/etc/ossec.conf:ro
    networks: [wazuh-backend]
    depends_on: [wazuh-indexer]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  wazuh-dashboard:
    image: ${WAZUH_DASHBOARD_IMAGE:?Set pinned immutable Wazuh dashboard image}
    pull_policy: never
    restart: unless-stopped
    environment:
      WAZUH_API_URL: https://wazuh-manager
    volumes:
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ${WAZUH_CERTS_DIR}/dashboard.pem:/usr/share/wazuh-dashboard/certs/dashboard.pem:ro
      - ${WAZUH_CERTS_DIR}/dashboard-key.pem:/usr/share/wazuh-dashboard/certs/dashboard-key.pem:ro
      - ${WAZUH_CONFIG_DIR:?Set vendored Wazuh config directory}/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ${WAZUH_CONFIG_DIR}/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    ports:
      - ${BIND_IP:-127.0.0.1}:${WAZUH_DASHBOARD_PORT:-8443}:5601
    networks: [wazuh-backend, frontend]
    depends_on: [wazuh-indexer]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
networks:
  wazuh-backend:
    internal: true
  frontend:

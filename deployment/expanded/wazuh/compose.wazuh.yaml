name: ${RIDGE_PROJECT:-silent-ridge}-wazuh
services:
  wazuh-indexer-certs-init:
    image: ${WAZUH_INDEXER_IMAGE:?Set pinned immutable Wazuh indexer image}
    pull_policy: never
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    # The pinned upstream wazuh.indexer.yml addresses its TLS material as
    # wazuh.indexer.pem / wazuh.indexer.key, but generate-certs.sh emits
    # indexer.pem / indexer-key.pem. The last three statements publish the
    # upstream names as copies so the digest-pinned vendored config is used
    # unmodified. Keep this a folded scalar without shell comments: `>-` joins
    # lines with spaces, so a `#` here would comment out everything after it.
    command:
      - >-
        umask 077;
        for name in root-ca.pem indexer.pem indexer-key.pem admin.pem admin-key.pem; do
          test -s "/source/$$name";
          cp "/source/$$name" "/target/$$name";
          chown 1000:1000 "/target/$$name";
          chmod 600 "/target/$$name";
        done;
        cp /source/indexer.pem /target/wazuh.indexer.pem;
        cp /source/indexer-key.pem /target/wazuh.indexer.key;
        chown 1000:1000 /target/wazuh.indexer.pem /target/wazuh.indexer.key;
        chmod 600 /target/wazuh.indexer.pem /target/wazuh.indexer.key
    volumes:
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}:/source:ro
      - wazuh-indexer-certs:/target
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  wazuh-dashboard-certs-init:
    image: ${WAZUH_INDEXER_IMAGE:?Set pinned immutable Wazuh indexer image}
    pull_policy: never
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    # Same upstream-naming mismatch as the indexer: the dashboard reads
    # wazuh-dashboard*.pem, generate-certs.sh emits dashboard*.pem. Keep this a
    # folded scalar without shell comments; a `#` would comment out the rest.
    command:
      - >-
        umask 077;
        for name in root-ca.pem dashboard.pem dashboard-key.pem; do
          test -s "/source/$$name";
          cp "/source/$$name" "/target/$$name";
          chown 1000:1000 "/target/$$name";
          chmod 600 "/target/$$name";
        done;
        cp /source/dashboard.pem /target/wazuh-dashboard.pem;
        cp /source/dashboard-key.pem /target/wazuh-dashboard-key.pem;
        chown 1000:1000 /target/wazuh-dashboard.pem /target/wazuh-dashboard-key.pem;
        chmod 600 /target/wazuh-dashboard.pem /target/wazuh-dashboard-key.pem
    volumes:
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}:/source:ro
      - wazuh-dashboard-certs:/target
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  wazuh-indexer:
    # The pinned upstream opensearch_dashboards.yml and wazuh.indexer.yml both
    # address the indexer as `wazuh.indexer` (upstream's service name and
    # hostname). This service was renamed to `wazuh-indexer`, so the upstream
    # name must be published explicitly or the dashboard fails with
    # `getaddrinfo ENOTFOUND wazuh.indexer` and never becomes healthy.
    # hostname: sets the container hostname; the alias below is what actually
    # makes the name resolvable on the shared wazuh-backend network.
    hostname: wazuh.indexer
    image: ${WAZUH_INDEXER_IMAGE:?Set pinned immutable Wazuh indexer image}
    pull_policy: never
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-indexer-certs:/usr/share/wazuh-indexer/certs:ro
      - ${WAZUH_CONFIG_DIR:?Set vendored Wazuh config directory}/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ${WAZUH_RUNTIME_CONFIG_DIR:?Set private rendered Wazuh config directory}/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    ports:
      # Loopback-only: controller provisioning/queries; participants use the dashboard.
      - ${BIND_IP:-127.0.0.1}:${WAZUH_INDEXER_PORT:-9200}:9200
    networks:
      wazuh-backend:
        aliases: [wazuh.indexer]
    depends_on:
      wazuh-indexer-certs-init: {condition: service_completed_successfully}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "curl --cacert /usr/share/wazuh-indexer/certs/root-ca.pem -s https://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
  wazuh-manager:
    image: ${WAZUH_MANAGER_IMAGE:?Set pinned immutable Wazuh manager image}
    pull_policy: never
    restart: unless-stopped
    environment:
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set generated Wazuh API password}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - ${WAZUH_CERTS_DIR:?Set generated local certificate directory}/root-ca.pem:/etc/ssl/certs/silent-ridge-root-ca.pem:ro
      # The image seeds /var/ossec/etc on first boot, then copies this file in.
      - ${WAZUH_RUNTIME_CONFIG_DIR:?Set rendered Wazuh config directory}/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Copy the CA-signed API certificate into the writable image path at boot.
      - ./api.yaml:/wazuh-config-mount/api/configuration/api.yaml:ro
      - ${WAZUH_CERTS_DIR}/manager.pem:/wazuh-config-mount/api/configuration/ssl/server.crt:ro
      - ${WAZUH_CERTS_DIR}/manager-key.pem:/wazuh-config-mount/api/configuration/ssl/server.key:ro
      - ${WAZUH_CERTS_DIR}/root-ca.pem:/wazuh-config-mount/api/configuration/ssl/ca.crt:ro
      - ./filebeat-init.sh:/etc/cont-init.d/1a-silent-ridge-filebeat:ro
    secrets: [wazuh_indexer_credential]
    networks: [wazuh-backend]
    depends_on: [wazuh-indexer]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD-SHELL, "pidof wazuh-analysisd >/dev/null && pidof wazuh-remoted >/dev/null && curl --fail --silent --max-time 5 --cacert /var/ossec/api/configuration/ssl/ca.crt --user \"$$API_USERNAME:$$API_PASSWORD\" -X POST https://localhost:55000/security/user/authenticate -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
  wazuh-dashboard:
    image: ${WAZUH_DASHBOARD_IMAGE:?Set pinned immutable Wazuh dashboard image}
    pull_policy: never
    restart: unless-stopped
    environment:
      WAZUH_API_URL: https://wazuh-manager
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set generated Wazuh API password}
    volumes:
      - wazuh-dashboard-certs:/usr/share/wazuh-dashboard/certs:ro
      - ${WAZUH_CONFIG_DIR:?Set vendored Wazuh config directory}/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    ports:
      - ${BIND_IP:-127.0.0.1}:${WAZUH_DASHBOARD_PORT:-8443}:5601
    networks: [wazuh-backend, frontend]
    depends_on:
      wazuh-dashboard-certs-init: {condition: service_completed_successfully}
      wazuh-indexer: {condition: service_healthy}
      wazuh-manager: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-indexer-certs:
  wazuh-dashboard-certs:
secrets:
  wazuh_indexer_credential:
    file: ${WAZUH_ADMIN_SECRET_FILE:?Set generated indexer admin credential file}
networks:
  wazuh-backend:
    internal: true
  frontend:

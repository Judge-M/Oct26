# Per-team desktop containers for the Docker-only desktop pivot.
#
# Additive to the Hyper-V desktop path: the VM provider is untouched. Each
# service exposes TigerVNC on TCP 5901 only on the external `desktop` network,
# which Guacamole already joins, so guacd reaches a desktop at
# `<service-name>:5901` (for example `desktop-team01:5901`). No VNC port is ever
# published to the host.
name: ${RIDGE_PROJECT:?Set event-scoped project}-desktops

x-desktop: &desktop
  image: ${RIDGE_DESKTOP_IMAGE:-silent-ridge-desktop:dev}
  pull_policy: never
  restart: unless-stopped
  shm_size: 2g
  environment:
    VNC_PASSWORD_FILE: /etc/silent-ridge/vnc-password
    IRIS_URL: ${IRIS_PUBLIC_URL:?Set participant IRIS URL}
    CTFD_URL: ${CTFD_PUBLIC_URL:?Set participant CTFd URL}
    WAZUH_URL: ${WAZUH_PUBLIC_URL:?Set participant Wazuh URL}
  deploy:
    resources:
      limits:
        cpus: ${RIDGE_DESKTOP_CPUS:-2}
        memory: ${RIDGE_DESKTOP_MEMORY:-4g}
  healthcheck:
    test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/5901'"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [desktop]

services:
  desktop-team01:
    <<: *desktop
    volumes:
      - ${RIDGE_CASE_DIR:?Set verified prepared case directory}:/opt/silent-ridge/prepared-case:ro
      - ${RIDGE_EVIDENCE_DIR:?Set published evidence directory}:/evidence:ro
      - ${RIDGE_ORIGINALS_DIR:?Set original evidence directory}:/originals:ro
      - team01-cases:/home/participant/Cases
      - team01-workspace:/home/participant/Workspace
      - team01-scratch:/home/participant/Scratch
    secrets:
      - source: vnc_password_team01
        target: vnc_password
  desktop-team02:
    <<: *desktop
    volumes:
      - ${RIDGE_CASE_DIR:?Set verified prepared case directory}:/opt/silent-ridge/prepared-case:ro

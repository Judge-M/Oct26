name: silent-ridge
services:
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
      - exercise
    depends_on:
      exercise:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
  exercise:
    build: .
    volumes:
      - ./runtime/public:/public:ro
      - ./runtime/state:/state
      - ./runtime/control:/control:ro
    secrets:
      - credentials
    networks:
      - exercise
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
secrets:
  credentials:
    file: ./runtime/credentials.json
networks:
  frontend:
  exercise:
    internal: true

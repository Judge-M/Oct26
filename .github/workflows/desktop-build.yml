name: Build desktop before runtime smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git lfs pull --include="assets/large/autopsy/**" --exclude=""
      - name: Build the actual desktop image (not a syntax check)
        run: python -m ridge.deploy build --component desktop
      - name: Start only after build and image verification pass
        run: bash tests/desktop_container_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-receipt
          path: work/build-receipts/*.json

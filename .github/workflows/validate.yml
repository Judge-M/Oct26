name: Validate expanded Silent Ridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git lfs pull --include="assets/large/binary/**" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ridge integrations expanded deployment/expanded
  ctfd-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployment/expanded/Dockerfile.ctfd -t silent-ridge-ctfd-smoke .
      - name: Actual CTFd adapter smoke (isolated, disposable, no network)
        run: docker run --rm --network none --user 0 --entrypoint python -v "$PWD/tests/ctfd_container_smoke.py:/tmp/smoke.py:ro" -e PYTHONPATH=/opt/CTFd silent-ridge-ctfd-smoke /tmp/smoke.py
  preparation-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git lfs pull --include="assets/large/binary/**" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python expanded/prepare.py work/evidence
      - name: Build harmless static training surrogate
        run: |
          mkdir -p work/rebuilt-binary
          cc -O0 -g -fno-inline -o work/rebuilt-binary/brief-viewer-training expanded/binary/brief-viewer-training.c
          cc --version > work/compiler-version.txt
          sha256sum work/rebuilt-binary/brief-viewer-training > work/binary-sha256.txt
          file work/rebuilt-binary/brief-viewer-training
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-fixtures-not-a-complete-offline-bundle
          path: |
            work/evidence
            work/compiler-version.txt
            work/binary-sha256.txt
            work/rebuilt-binary
          retention-days: 14
